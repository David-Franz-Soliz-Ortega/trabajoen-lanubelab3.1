services:
  api:
    build: .
    ports:
      - "3005:3000"
    environment:
      - DB_HOST=db
      - DB_USER=root
      - DB_PASS=secret
  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: secret
      MYSQL_DATABASE: crud_db
    volumes:
      - db_data:/var/lib/mysql

volumes:
  db_data: